name: CI

# Locks in the M7 correctness closure. The `gate` job runs the SAME three checks as the local
# pre-commit hook (scripts/git-hooks/pre-commit) — fmt + clippy(-D warnings) + the full test
# suite — and additionally sets PHORJ_REQUIRE_PHP=1 so the PHP oracle in tests/differential.rs
# FAILS (never silently skips) if transpiled PHP diverges from the interpreter/VM. The
# `cross-build` job exercises `phg build --target` parity across the four Phase-2 cross targets.
#
# Every job but two runs in the toolchain image docker/Dockerfile defines, the one every local gate and git hook runs
# in (docs/plans/2026-11-19-dockerize.plan.md): one PHP build, one PCRE2, one Rust, so a local green and a CI green
# mean the same thing. `.github/actions/phorj-image` builds it from the Actions layer cache; each step is
# `scripts/dk <command>`. The two exceptions: `unsafe-island` (a grep, no toolchain) and `oracle-nightly` (PHP 8.7-dev
# has no official image; non-gating).

# `ccr-*`, `claude/**` and `cloud/**` are cloud-session branches (DEC-569, DEC-577): cloud work never
# lands on master, so CI runs the gate on them on GitHub's runners, independently of the cloud box (whose
# pre-push is fail-closed: it needs the PHP 8.5 oracle that .claude/cloud-setup.sh installs).
# scripts/test-cloud-ready.sh, run by pre-push, keeps these patterns from drifting.
on:
  push:
    branches: [master, 'ccr-*', 'claude/**', 'cloud/**']
  pull_request:
    branches: [master]

# A newer push to the same ref cancels the in-flight run — saves CI minutes on rapid iteration.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: gate (fmt + clippy + test + PHP oracle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The image carries the toolchain rust-toolchain.toml pins, PHP 8.5 (the transpile floor) with bcmath,
      # llvm-objcopy (the host `phg build` tests: without it built_binary_keeps_stdout_written_before_a_fault
      # fails by design, DEC-530) and cargo-nextest. Testing against the floor is the strict gate; `gate-php86`
      # below runs the same tests on 8.6, because a PHP default can change between minors (DEC-588, ruled 2026-11-23).
      - uses: ./.github/actions/phorj-image
        with:
          cache-key: gate
      - name: cargo fmt --check
        run: scripts/dk cargo fmt --check
      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: scripts/dk cargo clippy --workspace --all-targets -- -D warnings
      # PHORJ_REQUIRE_PHP=1 turns a missing or non-working php into a test FAILURE: this line is what "locks in" M7.
      # --workspace also gates the playground crate. --no-fail-fast: cargo test stops at the first failing test
      # BINARY by default, so one red test in tests/build.rs once hid 43 later binaries (2026-09-24..28).
      - name: cargo test (PHP oracle enforced)
        env:
          PHORJ_REQUIRE_PHP: '1'
        run: scripts/dk cargo test --workspace --no-fail-fast

  perf-gate:
    # Lane 2 W1: block a gross VM performance regression. scripts/perf-gate.sh gates on `vm_speedup`
    # (tree-walk / VM ratio) from `phg benchmark --json` — machine-independent (both backends share the
    # CPU), unlike absolute ns. Timing noise is one-directional (only ever slows a run), so the script
    # takes best-of-N and a generous floor (bench/baseline.json: baseline_vm_speedup * min_ratio ≈ 10.8
    # vs a true ~20-25) — huge margin, so a noisy runner still clears it while a real ~1.7x+ regression
    # trips it. If a shared runner ever false-fails, lower min_ratio in the baseline or set
    # continue-on-error here; do not delete the gate.
    name: perf-gate (VM regression)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/phorj-image
        with:
          cache-key: release
      - name: Build release binary
        run: scripts/dk cargo build --release --bin phg
      - name: Run perf gate
        run: scripts/dk bash scripts/perf-gate.sh

  unsafe-island:
    # Domain #7 (native codegen / JIT) will carry phorj's only first-party `unsafe`, confined to
    # src/jit/ via a crate-root `#![deny(unsafe_code)]` + a single `#![allow(unsafe_code)]` island.
    # `deny` (unlike `forbid`) permits a scoped allow, so this gate machine-enforces the confinement:
    # it fails if an `allow(unsafe_code)` escape hatch appears anywhere outside src/jit/. The crate
    # roots are now `#![deny(unsafe_code)]` with the single audited island in src/jit/mod.rs (landed
    # with JIT codegen slice 1) — this gate keeps that confinement from ever widening.
    name: unsafe-island (first-party unsafe confined to src/jit/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No allow(unsafe_code) outside src/jit/
        run: |
          hits="$(grep -rnE 'allow[[:space:]]*\([[:space:]]*unsafe_code' src --include='*.rs' | grep -v '^src/jit/' || true)"
          if [ -n "$hits" ]; then
            echo "unsafe-island: FAIL — allow(unsafe_code) outside src/jit/ (first-party unsafe must live only in the JIT island):" >&2
            echo "$hits" >&2
            exit 1
          fi
          echo "unsafe-island: OK — no allow(unsafe_code) escape outside src/jit/"

  jit:
    # The Cranelift JIT backend (dep-policy domain #7) sits behind the `jit` feature — a DEFAULT
    # feature since 2026-07-09, so the `gate` job's `cargo test --workspace` DOES compile it. This
    # job is kept as an explicit-feature belt-and-braces run (it survives any future change to the
    # default set, so src/jit/ can never silently drop out of CI — the structural false-green
    # pattern this project keeps guarding against). `-p phorj` (not --workspace)
    # because the playground member has no `jit` feature. clippy runs `--all-targets` under the feature, so it
    # COMPILES every target; the test step is scoped to the JIT lib tests (`--lib jit::`), which cross-check JIT
    # output against the in-process VM oracle that the `gate` job validates against real PHP.
    name: jit (Cranelift feature build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/phorj-image
        with:
          cache-key: jit
      - name: cargo clippy -p phorj --features jit --all-targets -- -D warnings
        run: scripts/dk cargo clippy -p phorj --features jit --all-targets -- -D warnings
      # Quoted: the `jit::` test filter ends in a colon, which an unquoted YAML scalar parses as a
      # mapping key ("mapping values are not allowed here"). Runs ONLY the src/jit/ lib tests.
      - name: "cargo test — JIT lib tests"
        run: "scripts/dk cargo test -p phorj --features jit --lib jit::"

  gate-php86:
    # The same test run on PHP 8.6 (GA 2026-11-19), GATING: the transpile floor stays 8.5 (the `gate`
    # job), and 8.6 must pass too, so an 8.6 incompatibility in transpiled output blocks the push
    # (developer ruling 2026-11-19, docs/plans/2026-11-19-dependency-refresh.plan.md). A separate job
    # rather than a matrix on `gate`, so the `gate` check keeps its name. Same Dockerfile, PHP_MINOR=8.6.
    name: gate on PHP 8.6 (test + PHP oracle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/phorj-image
        with:
          php-minor: '8.6'
          cache-key: gate86
      - name: cargo test (PHP oracle enforced, 8.6)
        env:
          PHORJ_REQUIRE_PHP: '1'
        run: scripts/dk --php 8.6 cargo test --workspace --no-fail-fast

  oracle-nightly:
    # Non-gating canary: run the PHP oracle against the in-development 8.7 (php-src master) so
    # bleeding-edge breakage surfaces early. continue-on-error keeps a flaky/unavailable dev build from
    # failing CI — the 8.5 `gate` and 8.6 `gate-php86` jobs are the reproducible source of truth.
    # DECLARED EXCEPTION to the docker rule (docs/plans/2026-11-19-dockerize.plan.md): php-src master has no
    # official image, so this job alone installs its toolchain on the runner.
    name: oracle on 8.7-dev (non-gating)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
      - name: Install PHP 8.7 (dev)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.7'
          extensions: bcmath
      - name: cargo test --test differential (PHP oracle, 8.7-dev)
        env:
          PHORJ_REQUIRE_PHP: '1'
        run: cargo test --test differential

  cross-build:
    # The image carries the four cross targets, llvm-objcopy (embeds the `.phorj` section into the cross-built stub,
    # src/bundle/cross.rs), zig (the cross linker, sha-checked) and cargo-zigbuild.
    name: cross-build (phg build --target parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/phorj-image
        with:
          cache-key: cross
      # build.rs already exercises x86_64-musl (native exec) and windows-gnu (PE round-trip).
      # This smoke covers the two aarch64 targets it does not run, so a broken aarch64 build still
      # surfaces. --cap-lints=warn mirrors cross.rs so target-specific lints don't trip the deny gate.
      - name: cargo zigbuild (aarch64 cross smoke)
        env:
          RUSTFLAGS: --cap-lints=warn
        run: |
          for t in aarch64-unknown-linux-gnu aarch64-unknown-linux-musl; do
            echo "::group::zigbuild $t"
            scripts/dk cargo zigbuild --release --bin phg --target "$t"
            echo "::endgroup::"
          done
      # The real cross-parity tests: cargo-zigbuild, the targets and llvm-objcopy are all in the image, so
      # tests/build.rs executes (instead of skipping) the musl native-exec and windows PE round-trip assertions.
      - name: cargo test --test build -- --test-threads=1 (cross parity)
        run: scripts/dk cargo test --test build -- --test-threads=1
